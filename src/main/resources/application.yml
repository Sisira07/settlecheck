spring:
  application:
    name: settlecheck
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:settlecheck}
    username: ${DB_USER:settlecheck}
    password: ${DB_PASSWORD:settlecheck}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

settlecheck:
  fee-tolerance-percent: 2.5   # allowed drift between order amount and settled net
  settlement-window-days: 5    # how many days after order creation a settlement may land
  min-confidence: 70           # subset-sum matches below this go to exceptions, never auto-resolved
  llm:
    enabled: false             # flip true once an LLM provider is wired into ExplainerService
